<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 5: Design with Sound & Vision</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Lahore - 3 Landmarks</h1>
<p>A soundscape and a visualscape. Press play, then click the picture.</p>

<div id="scene" onclick="nextImage()"></div>

<audio id="player">
  <source src="audio/soundscape.mp3" type="audio/mpeg">
  This browser does not support audio.
</audio>

<div>
  <button onclick="playAudio()">Play</button>
  <button onclick="pauseAudio()">Pause</button>
  <button onclick="stopAudio()">Stop</button>
  <button onclick="volumeDown()">Volume -</button>
  <button onclick="volumeUp()">Volume +</button>
</div>

<p id="message">Press play to begin.</p>

<script src="script.js"></script>
</body>
</html>
