<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 5: Design with Sound & Vision</title>
<style>
  body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #101820;
    color: #f2ead7;
    text-align: center;
  }
  h1 { margin: 30px 10px 5px; }
  p { margin: 6px 10px; }
  #scene {
    width: 90%;
    max-width: 700px;
    height: 360px;
    margin: 25px auto;
    border-radius: 12px;
    background-image: linear-gradient(135deg, #2b5876, #4e4376);
    background-size: cover;
    background-position: center;
    transition: all 0.6s;
    cursor: pointer;
  }
  button {
    padding: 10px 18px;
    margin: 6px;
    border: none;
    border-radius: 6px;
    background-color: #ffd27a;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>My Place</h1>
<p>A soundscape and a visualscape. Press play, then click the picture.</p>

<div id="scene" onclick="nextImage()"></div>

<audio id="player">
  <source src="audio/soundscape.mp3" type="audio/mpeg">
  This browser does not support audio.
</audio>

<div>
  <button onclick="playAudio()">Play</button>
  <button onclick="pauseAudio()">Pause</button>
  <button onclick="stopAudio()">Stop</button>
  <button onclick="volumeDown()">Volume -</button>
  <button onclick="volumeUp()">Volume +</button>
</div>

<p id="message">Press play to begin.</p>

<script>
  let player = document.getElementById("player");
  let scene = document.getElementById("scene");
  let message = document.getElementById("message");

  let images = ["images/image1.jpg", "images/image2.jpg", "images/image3.jpg"];
  let imageNumber = -1;

  // ---------- CONTROLS ----------
  function playAudio() {
    player.play();
  }

  function pauseAudio() {
    player.pause();
  }

  function stopAudio() {
    player.pause();
    player.currentTime = 0;
    updateMessage();
  }

  function volumeUp() {
    if (player.volume < 0.9) {
      player.volume = player.volume + 0.1;
    } else {
      player.volume = 1;
    }
    updateMessage();
  }

  function volumeDown() {
    if (player.volume > 0.1) {
      player.volume = player.volume - 0.1;
    } else {
      player.volume = 0;
    }
    updateMessage();
  }

  // ---------- TEXT ----------
  function updateMessage() {
    let seconds = Math.round(player.currentTime);
    let volume = Math.round(player.volume * 10);
    message.innerHTML = "Time: " + seconds + "s | Volume: " + volume + "/10";
  }

  // ---------- VISUALS THAT RESPOND TO THE SOUND ----------
  function playerStarted() {
    scene.style.boxShadow = "0 0 40px #ffd27a";
    updateMessage();
  }

  function playerPaused() {
    scene.style.boxShadow = "none";
    scene.style.filter = "none";
  }

  function playerProgressed() {
    updateMessage();
    let t = player.currentTime;
    if (t < 20) {
      scene.style.filter = "brightness(0.8)";
    } else if (t < 40) {
      scene.style.filter = "brightness(1) saturate(1.5)";
    } else if (t < 60) {
      scene.style.filter = "hue-rotate(60deg)";
    } else {
      scene.style.filter = "hue-rotate(160deg) brightness(1.2)";
    }
  }

  function playerEnded() {
    scene.style.boxShadow = "none";
    scene.style.filter = "none";
    message.innerHTML = "The soundscape has ended.";
  }

  player.addEventListener("play", playerStarted);
  player.addEventListener("pause", playerPaused);
  player.addEventListener("timeupdate", playerProgressed);
  player.addEventListener("ended", playerEnded);

  // ---------- CLICK THE PICTURE TO CHANGE IT ----------
  function nextImage() {
    imageNumber = imageNumber + 1;
    if (imageNumber >= images.length) {
      imageNumber = 0;
    }
    scene.style.backgroundImage = "url('" + images[imageNumber] + "')";
  }
</script>

</body>
</html>
