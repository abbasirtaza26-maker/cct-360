<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Carousel — Two Stories</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>The Power of Sequencing</h1>

  <section class="story">
    <h2>Story 1: Enjoying the Coffee</h2>
    <img id="img1" src="Images/IMAGE1.jpg" alt="Story 1 image">
    <p id="caption1">Beginning: An empty cup, waiting to be filled.</p>
    <button id="prev1">Previous</button>
    <button id="next1">Next</button>
  </section>

  <section class="story">
    <h2>Story 2: Making the Coffee</h2>
    <img id="img2" src="Images/IMAGE3.jpg" alt="Story 2 image">
    <p id="caption2">Beginning: A finished espresso, freshly made.</p>
    <button id="prev2">Previous</button>
    <button id="next2">Next</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
