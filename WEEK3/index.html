<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Power of Sequencing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>The Power of Sequencing</h1>
  <p class="subtitle">Same three pictures in two different orders tell two different stories.</p>

  <div class="story-select">
    <button id="selectStory1" class="active">Story 1: Going to the Movies</button>
    <button id="selectStory2">Story 2: Coming Home from the Movies</button>
  </div>

  <h2 id="storyTitle">Story 1: Going to the Movies</h2>

  <img id="storyImg" src="IMAGES/IMAGE1.jpg" alt="Story image">
  <p id="storyCaption">Beginning: Thinking about a movie to watch.</p>

  <div class="controls">
    <button id="prevBtn">Previous</button>
    <button id="nextBtn">Next</button>
  </div>

  <p class="hint">Click Next, Previous, or the picture itself to move through the story.</p>

  <script src="script.js"></script>
</body>
</html>
