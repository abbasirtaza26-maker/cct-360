<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Day's Journey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="sunrise">
    <div>
      <h1>The Day Begins</h1>
      <p>As the sun breaks over the horizon, the world wakes.</p>
    </div>
  </section>

  <section class="sunset">
    <div>
      <h1>The Light Fades</h1>
      <p>Colors deepen as the sun sinks below the horizon.</p>
    </div>
  </section>

  <section class="night">
    <div>
      <h1>Night Falls</h1>
      <p>Stars emerge, and the day gives way to quiet darkness.</p>
    </div>
  </section>

</body>
</html>
